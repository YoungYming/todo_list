<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Todo Server{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=20260530-5" />
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="app-shell">
    <aside class="app-sidebar" role="navigation" aria-label="主导航">
      <a href="/app" class="app-sidebar__brand">
        <span class="app-sidebar__brand-mark" aria-hidden="true"></span>
        Focus
      </a>
      <nav class="app-sidebar__nav">
        <a href="/app" data-panel="today" class="app-sidebar__link {% if request.url.path == '/app' or request.url.path == '/app/' or request.url.path == '/app/today' %}app-sidebar__link--active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          今日待办
        </a>
        <a href="/app" data-panel="epics" class="app-sidebar__link {% if request.url.path.startswith('/app/epics') %}app-sidebar__link--active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Epic 看板
        </a>
        <a href="/app" data-panel="history" class="app-sidebar__link {% if request.url.path.startswith('/app/history') %}app-sidebar__link--active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          历史记录
        </a>
        <a href="/docs" class="app-sidebar__link app-sidebar__link--muted" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          API 文档
        </a>
      </nav>
      <div class="app-sidebar__footer">
        <a href="/" class="app-sidebar__link app-sidebar__link--muted">服务首页</a>
      </div>
    </aside>
    <main class="app-main" role="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>window.API_BASE = {{ (api_base_path | default('', true)) | tojson }};</script>
  <script src="/static/app.js"></script>
  <script src="/static/toast.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
